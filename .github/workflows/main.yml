name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Aceptar licencias del SDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Instalar SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer el proyecto
        run: |
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'RobotCarControlAOORK404-GitHubActions*.zip' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo "No se encontró el ZIP del proyecto en la raíz."
            exit 1
          fi
          unzip -q "$ARCHIVE" -d source

      - name: Compilar APK
        run: gradle --no-daemon --stacktrace -p source/RobotCarControlAOORK404 assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: RobotCarControlAOORK404-debug-apk
          path: source/RobotCarControlAOORK404/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
